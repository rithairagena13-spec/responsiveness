<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title> rumora-resiponsiveness-navbar</title>
</head>
<body class="min-h-screen bg-slate-950 text-white">

     <!-- Navbar -->
    <header class="relative border-b border-white/10 bg-slate-900">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 md:px-8">

        



<!-- Brand -->
<a href="#home"
   class="rounded text-2xl font-extrabold tracking-widest text-cyan-400 transition-colors hover:text-cyan-300 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400">
    LUMORA<span class="text-white">.</span>
</a>

<!-- Desktop navigation -->
<div class="hidden items-center gap-8 md:flex">
    <a href="#home" class="rounded text-cyan-400 transition-colors hover:text-cyan-300 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400">Home</a>

    <a href="#about" class="rounded text-slate-300 transition-colors hover:text-cyan-400 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400">About</a>

    <a href="#services" class="rounded text-slate-300 transition-colors hover:text-cyan-400 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400">Services</a>

    <a href="#contact" class="rounded text-slate-300 transition-colors hover:text-cyan-400 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400">Contact</a>
    
<a href="#signup"
   class="rounded-full bg-cyan-400 px-5 py-2.5 font-semibold text-slate-950 transition-colors hover:bg-cyan-300 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400"> Sign Up</a>

</div>


<!-- Mobile menu -->
<div class="relative md:hidden">

    <input type="checkbox"id="menu-toggle"class="peer sr-only">


<!-- Hamburger button -->
<label for="menu-toggle"
       class="flex cursor-pointer items-center justify-center rounded-lg p-2 transition-colors hover:bg-slate-800 hover:text-cyan-400 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-cyan-400"
       aria-label="Toggle navigation menu">

    <!-- Hamburger icon -->
    <svg class="h-7 w-7"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor"
         stroke-width="2"
         aria-hidden="true">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"/>
    </svg>

</label>


<!-- Mobile links -->
<div class="absolute right-0 top-full z-50 hidden w-64 rounded-lg border border-white/10 bg-slate-900 p-3 shadow-xl peer-checked:block">
    <div class="flex flex-col gap-1">
        <a href="#home" class="rounded-lg px-4 py-3 text-cyan-400 hover:bg-slate-800">Home</a>
        <a href="#about" class="rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-cyan-400">About</a>
        <a href="#services" class="rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-cyan-400">Services</a>
        <a href="#contact" class="rounded-lg px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-cyan-400">Contact</a>
        <a href="#signup" class="rounded-lg px-4 py-3 font-semibold text-cyan-400 hover:bg-slate-800">Sign Up</a>
    </div>
</div>


</div>

   </nav>
   </header> 

       <!-- Hero Section -->
    <main id="home" class="px-6 py-20 text-center md:py-28">

        <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-cyan-400">
            Bright ideas. Better experiences.
        </p>

                <!-- Hero Heading -->
        <h1 class="mx-auto max-w-4xl text-4xl font-bold leading-tight tracking-tight text-white md:text-6xl">
            Build Something Amazing Together.
        </h1>

        <!-- Hero Description -->
        <p class="mx-auto mt-6 max-w-2xl text-base leading-7 text-slate-400 md:text-lg">
            Discover new possibilities with Lumora. We create meaningful digital experiences that bring bright ideas to life.
        </p>
    </main>
</body>
</html>
